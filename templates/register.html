<!DOCTYPE html>
<html>
<head>
    <title>Register | FinTrack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="minimal-auth-body">

<header class="minimal-header">
    <div class="brand-name">FinTrack</div>
    <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <button class="dark-toggle" onclick="toggleDarkMode()">Dark Mode</button>
    </nav>
</header>

<main class="minimal-auth-main">
    <div class="minimal-auth-card">
        <h1>Create FinTrack account</h1>
        <p class="auth-subtitle">Use a strong password to protect your account.</p>

{% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="{{ category }}">{{ message }}</p>
{% endfor %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>

            <label>Password</label>
            <input id="password" type="password" name="password" placeholder="Example: Test123!" required oninput="checkPasswordStrength()">

            <div class="strength-box">
                <div id="strength-bar"></div>
            </div>
            <p id="strength-text" class="strength-text">Password strength</p>

            <button type="submit" class="primary-action">Create Account</button>
        </form>

        <p class="auth-note">
            Already have an account? <a href="/login">Login</a>
        </p>
    </div>
</main>

<script src="/static/script.js"></script>
</body>
</html>
