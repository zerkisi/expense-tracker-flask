<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | FinTrack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app-body">

<div class="container">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter your username and a new strong password.</p>

{% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="{{ category }}">{{ message }}</p>
{% endfor %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" placeholder="Username" required>

        <label>New Password</label>
        <input id="password" type="password" name="new_password" placeholder="Example: Test123!" required oninput="checkPasswordStrength()">

        <div class="strength-box">
            <div id="strength-bar"></div>
        </div>
        <p id="strength-text" class="strength-text">Password strength</p>

        <button type="submit">Reset Password</button>
    </form>

    <p class="switch"><a href="/login">Back to Login</a></p>
</div>

<script src="/static/script.js"></script>
</body>
</html>
