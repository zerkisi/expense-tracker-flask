<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense | FinTrack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="form-page">
    <div class="container">
        <h1>Edit Expense</h1>
        <p class="subtitle">Update your spending record.</p>

        {% for message in get_flashed_messages() %}
            <p class="error">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <label>Title</label>
            <input type="text" name="title" value="{{ expense['title'] }}" required>

            <label>Amount</label>
            <input type="number" step="0.01" name="amount" value="{{ expense['amount'] }}" required>

            <label>Category</label>
            <select name="category" required>
                {% for c in ["Food", "Transport", "Education", "Shopping", "Health", "Bills", "Entertainment", "Other"] %}
                    <option value="{{ c }}" {% if expense['category'] == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>

            <label>Date</label>
            <input type="date" name="expense_date" value="{{ expense['expense_date'] }}" required>

            <label>Payment Method</label>
            <select name="payment_method" required>
                {% for method in ["Cash", "Credit Card", "Debit Card", "Bank Transfer"] %}
                    <option value="{{ method }}" {% if expense['payment_method'] == method %}selected{% endif %}>{{ method }}</option>
                {% endfor %}
            </select>

            <label>Status</label>
            <select name="status" required>
                <option value="Paid" {% if expense['status'] == "Paid" %}selected{% endif %}>Paid</option>
                <option value="Pending" {% if expense['status'] == "Pending" %}selected{% endif %}>Pending</option>
            </select>

            <label class="checkbox-label">
                <input type="checkbox" name="is_recurring" {% if expense['is_recurring'] %}checked{% endif %}>
                Recurring Expense
            </label>

            <label>Note</label>
            <input type="text" name="note" value="{{ expense['note'] }}">

            <button type="submit">Update Expense</button>
        </form>

        <p class="switch"><a href="/dashboard">Back to Dashboard</a></p>
    </div>
</div>
</body>
</html>
