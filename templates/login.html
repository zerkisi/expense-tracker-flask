<!DOCTYPE html>
<html>
<head>
    <title>Login | FinTrack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="minimal-auth-body">

<header class="minimal-header">
    <div class="brand-name">FinTrack</div>
    <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        <button class="dark-toggle" onclick="toggleDarkMode()">Dark Mode</button>
    </nav>
</header>

<main class="minimal-auth-main">
    <div class="minimal-auth-card">
        <h1>Login to FinTrack</h1>
        <p class="auth-subtitle">Manage your expenses in one simple dashboard.</p>

        {% for message in get_flashed_messages() %}
            <p class="error">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit" class="primary-action">Login</button>
        </form>

        <p class="switch"><a href="/forgot">Forgot Password?</a></p>

        <p class="auth-note">
            Don’t have an account? <a href="/register">Create account</a>
        </p>
    </div>
</main>

<script src="/static/script.js"></script>
</body>
</html>
