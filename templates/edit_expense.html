<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense | Expense Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="form-page">
    <div class="container">
        <h1>Edit Expense</h1>
        <p class="subtitle">Update your spending record.</p>

        {% for message in get_flashed_messages() %}
            <p class="error">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <input type="text" name="title" value="{{ expense['title'] }}" required>
            <input type="number" step="0.01" name="amount" value="{{ expense['amount'] }}" required>

            <select name="category" required>
                <option value="Food" {% if expense['category'] == 'Food' %}selected{% endif %}>Food</option>
                <option value="Transport" {% if expense['category'] == 'Transport' %}selected{% endif %}>Transport</option>
                <option value="Education" {% if expense['category'] == 'Education' %}selected{% endif %}>Education</option>
                <option value="Shopping" {% if expense['category'] == 'Shopping' %}selected{% endif %}>Shopping</option>
                <option value="Health" {% if expense['category'] == 'Health' %}selected{% endif %}>Health</option>
                <option value="Other" {% if expense['category'] == 'Other' %}selected{% endif %}>Other</option>
            </select>

            <input type="date" name="expense_date" value="{{ expense['expense_date'] }}" required>
            <input type="text" name="note" value="{{ expense['note'] }}">
            <button type="submit">Update Expense</button>
        </form>

        <p class="switch"><a href="/dashboard">Back to Dashboard</a></p>
    </div>
</div>
</body>
</html>
