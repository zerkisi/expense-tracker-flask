<!DOCTYPE html>
<html>
<head>
    <title>Register | FinTrack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="minimal-auth-body">

<header class="minimal-header">
    <div class="brand-name">FinTrack</div>
    <nav>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </nav>
</header>

<main class="minimal-auth-main">
    <div class="minimal-auth-card">
        <h1>Create FinTrack account</h1>
        <p class="auth-subtitle">Start tracking your personal spending securely.</p>

        {% for message in get_flashed_messages() %}
            <p class="error">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Choose a password" required>

            <button type="submit" class="primary-action">Create Account</button>
        </form>

        <p class="auth-note">
            Already have an account? <a href="/login">Login</a>
        </p>
    </div>
</main>

</body>
</html>
